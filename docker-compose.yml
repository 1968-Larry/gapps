services:
  app:
    container_name: app
    image: app
    build:
      context: .
      dockerfile: Dockerfile
      # Proxy for apt/pip during the build. A Dockerfile cannot see the host
      # environment, so compose forwards it: first .env / the shell
      # (HTTP_PROXY), then the lowercase variant (http_proxy, as set in
      # /etc/environment). Empty = no proxy. These are Docker's predefined proxy
      # build args, so they are not stored in the image layers or history.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
        http_proxy: ${HTTP_PROXY:-${http_proxy:-}}
        https_proxy: ${HTTPS_PROXY:-${https_proxy:-}}
        no_proxy: ${NO_PROXY:-${no_proxy:-}}
    depends_on:
      - postgres
    networks:
      - db_nw
      - web_nw
    ports:
      - "8000:5000"
    restart: unless-stopped
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRES_USER:-db1}:${POSTGRES_PASSWORD:-db1}@${POSTGRES_HOST:-postgres}/${POSTGRES_DB:-db1}
      - RESET_DB=${RESET_DB:-no}
      - VERSION=${VERSION:-1.0.0}
      - POSTGRES_USER=${POSTGRES_USER:-db1}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-db1}
      - POSTGRES_DB=${POSTGRES_DB:-db1}
      - GUNICORN_WORKERS=2
    #env_file:
    #  - .env

  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db1}
      POSTGRES_DB: ${POSTGRES_DB:-db1}
      PGDATA: /data/postgres
    #volumes:
    #   - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - db_nw
    restart: unless-stopped

networks:
  db_nw:
    driver: bridge
  web_nw:
    driver: bridge
volumes:
  dbdata: