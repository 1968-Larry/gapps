# Builds the image, starts gapps with Postgres and demo data, requests every
# page and API endpoint, checks the CDN files against their SRI hashes and
# audits Python and npm dependencies for known vulnerabilities.
# Runs on every push and PR (including Dependabot PRs) and weekly, so new
# advisories against pinned versions show up even without code changes.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # When vendor/package.json changed but app/static/vendor/ is not synced yet,
  # the vendor-sync workflow commits the files and starts ci again; skip this run.
  vendor-state:
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.check.outputs.synced }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          synced=$(python3 -c "
          import json
          want = json.load(open('vendor/package.json'))['dependencies']
          try:
              have = json.load(open('app/static/vendor/manifest.json'))['packages']
          except OSError:
              have = {}
          print('true' if all(have.get(k) == v for k, v in want.items()) else 'false')
          ")
          echo "synced=$synced" >> "$GITHUB_OUTPUT"
          [ "$synced" = true ] || echo "::notice::app/static/vendor is not synced yet; vendor-sync will run ci on the synced commit"

  test:
    needs: vendor-state
    if: needs.vendor-state.outputs.synced == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build app

      - name: Start gapps and Postgres
        id: up
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1; then
              echo "gapps is up"; exit 0
            fi
            sleep 5
          done
          docker compose logs app
          exit 1

      - name: Demo data
        run: docker compose exec -T app python3 tools/seed_demo.py --projects 2 --frameworks soc2,iso_27001_2022

      - name: Installed Python packages
        run: docker compose exec -T app pip freeze --all

      - name: manage.py commands load
        run: docker compose exec -T app python3 manage.py --help

      - name: Login over HTTP (gunicorn, real cookies)
        run: |
          # the built-in admin must change its password first; skip that here
          docker compose exec -T app python3 -c "
          from datetime import datetime
          from app import create_app, db
          from app.models import User
          app = create_app()
          with app.app_context():
              u = User.query.filter_by(email='admin@example.com').first()
              u.last_password_change = datetime.utcnow()
              db.session.commit()
          "
          curl -fsS -c jar -b jar -o /dev/null -w "POST /login -> %{http_code} %{redirect_url}\n" \
            -d email=admin@example.com -d password=admin1234567 http://localhost:8000/login
          code=$(curl -sS -b jar -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/session)
          echo "GET /api/v1/session -> $code"
          test "$code" = 200

      - name: Smoke test (every page and API endpoint)
        run: docker compose exec -T app python3 tools/smoke_test.py --clear-pwd-change

      - name: Browser test (editor and main pages in Chromium)
        if: always() && steps.up.outcome == 'success'
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          ids=$(docker compose exec -T app python3 -c "
          from app import create_app
          from app.models import Tenant, Project
          app = create_app()
          with app.app_context():
              t = Tenant.query.filter_by(name='demo').first()
              p = Project.query.filter_by(tenant_id=t.id).first()
              print(t.id, p.id)
          " 2>/dev/null | tail -1)
          python3 -m http.server 8099 > /dev/null 2>&1 &
          sleep 1
          python3 tools/browser_test.py --tid ${ids% *} --pid ${ids#* }

      - name: CDN files match the committed files (ASSET_MODE=cdn)
        if: always()
        run: docker compose exec -T app python3 tools/check_cdn_assets.py

      - name: App log
        if: failure()
        run: docker compose logs app | tail -200

      - name: Audit Python packages (as installed in the image)
        if: always()
        run: |
          # pip-audit in its own venv, so its packages are not audited with the app's
          docker compose exec -T app sh -c 'python3 -m venv /tmp/pa && /tmp/pa/bin/pip install --quiet --disable-pip-version-check pip-audit && /tmp/pa/bin/pip-audit --desc --path "$(python3 -c "import site; print(site.getsitepackages()[0])")"'

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22

      - name: Audit browser libraries (vendor/, shipped packages only)
        if: always()
        run: node scripts/npm-audit-direct.mjs vendor

      # Build tools for main.css only, never shipped: fail on high/critical
      - name: Audit Tailwind build tools (tl_src/)
        if: always()
        working-directory: tl_src
        run: npm audit --audit-level=high
