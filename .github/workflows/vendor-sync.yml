# Keeps app/static/vendor/ in step with vendor/package.json.
#
# When vendor/package.json (or the asset mapping) changes on any branch - a
# Dependabot PR or your own edit - this installs the packages, copies the files
# to app/static/vendor/, writes manifest.json with the SRI hashes and commits
# the result to the same branch. The server then only needs `git pull`.
#
# The second job refreshes tl_src/package-lock.json (the Tailwind build tools)
# to the newest versions allowed by tl_src/package.json and applies
# `npm audit fix` to it, when tl_src/package.json changes.
name: vendor-sync

on:
  push:
    paths:
      - vendor/package.json
      - vendor/package-lock.json
      - vendor/assets.json
      - vendor/.npmrc
      - scripts/sync-vendor.mjs
      - tl_src/package.json
      - .github/workflows/vendor-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and copy vendor assets
        run: bash scripts/vendor-assets.sh

      - name: Commit changes
        run: |
          git add vendor/package-lock.json app/static/vendor
          if git diff --cached --quiet; then
            echo "app/static/vendor is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync vendor assets with vendor/package.json"
          git push

  tl-src-lock:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfile and apply npm audit fix
        working-directory: tl_src
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Commit changes
        run: |
          git add tl_src/package-lock.json
          if git diff --cached --quiet; then
            echo "tl_src/package-lock.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh tl_src/package-lock.json"
          git pull --rebase
          git push
