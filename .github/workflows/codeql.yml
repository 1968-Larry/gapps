# CodeQL code scanning (advanced setup). Results: Security > Code scanning.
# Do not also turn on "Default setup" in the settings: the two would conflict.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # python: the app; javascript-typescript: static/js and scripts in the
        # templates; actions: the workflows themselves (vendor-sync can push)
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - app/static/vendor
              - vendor/node_modules
              - tl_src/node_modules
              - app/files

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
